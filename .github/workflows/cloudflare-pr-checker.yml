name: Cloudflare PR Check

on:
  workflow_call:
    inputs:
      terraform_version:
        required: false
        type: string
        default: '1.10.5'
      directories:
        required: false
        type: string
        default: '["."]'
      plan:
        required: false
        type: boolean
        default: false
      gcp-backend-prefix:
        required: false
        type: string
        default: ''
    secrets:
      GCP_SA_KEY:
        required: false
      GCP_PROJECT_ID:
        required: false
      CLOUDFLARE_API_TOKEN_PLAN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false

jobs:
  cloudflare-check:
    name: "Format, Validate & Plan"
    runs-on: self-hosted
    permissions:
      contents: read

    strategy:
      matrix:
        directory: ${{ fromJson(inputs.directories) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ${{ matrix.directory }}

      - name: Validate Config
        run: |
          cd ${{ matrix.directory }}
          terraform init -backend=false
          terraform validate

      - name: Authenticate to Google Cloud (state bucket)
        if: inputs.plan
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Generate Remote Backend for CI
        if: inputs.plan && inputs.gcp-backend-prefix != ''
        run: |
          cd ${{ matrix.directory }}
          cat <<EOF > backend_ci.tf
          terraform {
            backend "gcs" {
              bucket = "tf-state-${{ secrets.GCP_PROJECT_ID }}"
              prefix = "${{ inputs.gcp-backend-prefix }}"
            }
          }
          EOF

      - name: Terraform Init (real backend)
        if: inputs.plan
        run: |
          cd ${{ matrix.directory }}
          terraform init -reconfigure

      - name: Terraform Plan
        if: inputs.plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PLAN }}
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          cd ${{ matrix.directory }}
          terraform plan -no-color -input=false
