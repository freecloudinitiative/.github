name: Frontend PR Checker

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  code-quality-and-lint:
    name: Code quality and lint
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Sanitize runner Git config
        shell: bash
        run: rm -f ~/.gitconfig || true
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run linter (Oxlint)
        run: npm run lint

  build:
    name: TypeScript build
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Sanitize runner Git config
        shell: bash
        run: rm -f ~/.gitconfig || true
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript typecheck and build
        run: npm run build

  test:
    name: Tests and coverage
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Sanitize runner Git config
        shell: bash
        run: rm -f ~/.gitconfig || true
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit & integration tests
        run: npm test -- --coverage
      - name: Upload Sonar coverage
        uses: actions/upload-artifact@v4
        with:
          name: sonar-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonar:
    name: SonarQube analysis
    needs: test
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Sanitize runner Git config
        shell: bash
        run: rm -f ~/.gitconfig || true
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Download Sonar coverage
        uses: actions/download-artifact@v4
        with:
          name: sonar-coverage
          path: coverage
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: >-
          env.SONAR_TOKEN != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      - name: Report unavailable Sonar token
        if: >-
          env.SONAR_TOKEN == '' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository)
        shell: bash
        run: |
          echo "::warning::SONAR_TOKEN is not available; skipping SonarQube analysis."
          echo "## SonarQube analysis skipped" >> "$GITHUB_STEP_SUMMARY"

  container-smoke-test:
    name: Container smoke test
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Sanitize runner Git config
        shell: bash
        run: rm -f ~/.gitconfig || true
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build arm64 image (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64-container
          cache-to: type=gha,mode=max,scope=arm64-container
